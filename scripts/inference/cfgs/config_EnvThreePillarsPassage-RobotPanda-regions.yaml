model_selection: 'bspline'  # 'bspline', 'waypoints'

#######################################################################################################################
# environment options

min_distance_q_pos_start_goal: 0.5

# Start/goal source: dataset, regions, states_file, or auto.
# regions samples EE poses from the YAML below, solves IK, and rejects colliding states.
start_goal_source: regions
selection_start_goal: validation
start_goal_regions_path: start_goal_regions/EnvThreePillarsPassage-RobotPanda-regions.yaml
start_goal_max_sampling_attempts: 100


planning_env_id: 'EnvThreePillarsPassage' # complete environment class exported by torch_robotics.environments
env_id_replace: null # deprecated compatibility field; do not set together with planning_env_id
#extra_boxes_yaml: warehouse/extra_boxes/warehouse_extra_boxes_narrow_020.yaml

grasped_object: null
#name: GraspedObjectBox
#    attached_to_frame: panda_hand
#    object_collision_margin: 0.02


# env kwargs
rotation_z_axis_deg: 0  # 障碍物绕世界原点旋转；regions 模式下起终点区域也应用相同旋转

# collision avoidance/checking options
# extra margin for object collision cost (sdf is clamped if it is greater than this value)
# 0.02 for 2D tasks, 0.05 for panda tasks  障碍物的额外安全距离
obstacle_cutoff_margin_extra: 0.05
# Points whose distance to the objects is less than this margin are considered in collision
margin_for_dense_collision_checking:  0.0

#######################################################################################################################
# task options

num_T_pts: 128  # number of time points in the trajectory (> 128 for smoother results)
trajectory_duration: 10.0  # seconds
phase_time_class: 'PhaseTimeLinear'  # PhaseTimeLinear, PhaseTimeSigmoid
#phase_time_class: 'PhaseTimeSigmoid'  # PhaseTimeLinear, PhaseTimeSigmoid

project_gradient_hierarchy: false  # project the gradients hierarchically

# if project_gradient_hierarchy is true, the cost/gradient hierarchy is defined from top to bottom
costs:
  CostTaskSpaceCollisionObjects:
    weight: 10.0
    use_only_on_extra_objects: false
  CostTaskSpaceCollisionSelf:
    weight: 1.0
  CostJointSpaceJointLimits:
    weight: 1.0
  CostTaskSpaceEEGoalPosition:
    weight: 1.0
  CostTaskSpaceEEGoalOrientation:
    weight: 1.0
  CostJointSpaceVelocity:
    weight: 0.02 #0.1 #0.01
  CostJointSpaceAcceleration:
    weight: 0.005 #0.05 #0.001
  CostJointSpacePathLength:
    weight: 0


n_trajectory_samples: 32

best_trajectory_selection: weighted_metrics
best_trajectory_weights:
  ee_position: 0.35
  ee_orientation: 0.20
  path_length: 0.15
  smoothness: 0.15
  velocity_limit_utilization: 0.075
  acceleration_limit_utilization: 0.075
best_trajectory_metric_scales:
  ee_position: 0.015
  ee_orientation: 1.5
  path_length: null
  smoothness: null
  velocity_limit_utilization: 0.3
  acceleration_limit_utilization: 0.15

#######################################################################################################################
# Planner options

planner_alg: 'mpd'  # diffusion_prior, diffusion_prior_then_guide, mpd, gp_prior_then_guide, knn_prior_then_guide, cvae, cvae_prior_then_guide

diffusion_sampling_method: 'ddim'  # ddim, ddpm (not tuned)

compute_costs_with_xrecon: false

n_diffusion_steps_without_noise: 0

extra_mp_steps: 0  # number of extra motion planning gradient steps

# ddim options
ddim:
  t_start_guide_steps_fraction: 0.2 #启用cost guide的步数/总推理步数 (最后几步的占比）
  ddim_sampling_timesteps: 15 #ddim的总共推理步数 15
  ddim_eta: 0.5  # 0.0 for ddim, 1.0 for ddpm 采样随机性 0最稳定
  ddim_skip_type: 'quadratic'  # 'uniform', 'quadratic', 'exponential' ddim跳步方式：均匀 二次 指数
  ee_goal_position_weight_start: 1.0
  ee_goal_position_weight_end: 3.0
  ee_goal_orientation_weight_start: 1.0
  ee_goal_orientation_weight_end: 3.0
  ddim_scale_grad_prior: 0.5 #0.25 #越大越相信先验，越小越受guide和cost影响
  #ddim_scale_grad_prior_end: 0.5
  n_guide_steps: 6 # 每个启用 guide 的 DDIM step 内做几次梯度引导。
  #越大：避障/目标优化更强，但更慢，也更可能不平滑。调试 2，正式 4，困难场景可试 6。
  guide_lr: 1.0 #guide 梯度步长。
  # 越大：cost 修正更激进。如果碰撞多，可以试 1.0 ~ 1.5；如果轨迹发抖、跳变、偏离太大，降到 0.3 ~ 0.7。
  max_perturb_x: 0.15  # maximum perturbation from the diffusion mean during guide steps，guide后允许的最大偏离幅度
  clip_grad: true #梯度裁剪，防止 cost guide 梯度过大。
  clip_grad_rule: 'value'  # 'norm', 'value' norm：按整体norm裁减到允许范围  value：逐元素
  max_grad_norm: 1.  # clip the norm of the control point gradients
  max_grad_value: 1.  # clip the control point gradients

# diffusion_prior_then_guide options
diffusion_prior_then_guide:  &repl
  n_guide_steps: 12  # the same number of guide steps as used in MPD with DDIM
  guide_lr: 0.01
  max_perturb_x: 0.15  # maximum perturbation from the diffusion mean during guide steps
  clip_grad: true
  clip_grad_rule: 'value'  # 'norm', 'value'
  max_grad_norm: 1.  # clip the norm of the control point gradients
  max_grad_value: 1.  # clip the control point gradients

# ddpm options
ddpm:
  t_start_guide_steps_fraction: 0.2
  prior_weight_with_guide: 0.95
  noise_std: 0.7
  n_guide_steps: 2
  guide_lr: 0.01
  max_perturb_x: 0.15  # maximum perturbation from the diffusion mean during guide steps
  clip_grad: true
  clip_grad_rule: 'value'  # 'norm', 'value'
  max_grad_norm: 1.  # clip the norm of the control point gradients
  max_grad_value: 1.  # clip the control point gradients

gp_prior_then_guide:
  <<: *repl

knn_prior_then_guide:
  <<: *repl

cvae_prior_then_guide:
  <<: *repl

rrtconnect_then_guide:
  <<: *repl
