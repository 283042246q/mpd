schema: marvin_bimanual_cooperative_regions/v1
planning_frame: world
grasp_profile: default_box

# The 30 x 24 x 20 cm box is side-grasped at y=+/-0.12 m. Compared with the
# original narrow central cells, these endpoints extend toward the independent
# table x/y support, with a modestly wider z/yaw range inside the cooperative
# xyz_yaw bounds. They are object-center regions, not one-arm TCP/cabinet regions;
# paired IK and payload collision checks still reject invalid samples.
object_regions:
  shared_near:
    {x: [0.40, 0.52], y: [-0.10, 0.10], z: [0.22, 0.30], yaw_deg: [-15.0, 15.0]}
  shared_middle:
    {x: [0.49, 0.61], y: [-0.13, 0.13], z: [0.22, 0.31], yaw_deg: [-18.0, 18.0]}
  shared_far:
    {x: [0.58, 0.70], y: [-0.10, 0.10], z: [0.22, 0.30], yaw_deg: [-15.0, 15.0]}
  shared_left_offset:
    {x: [0.46, 0.64], y: [0.10, 0.29], z: [0.23, 0.31], yaw_deg: [-15.0, 15.0]}
  shared_right_offset:
    {x: [0.46, 0.64], y: [-0.29, -0.10], z: [0.23, 0.31], yaw_deg: [-15.0, 15.0]}

# Longitudinal transfers dominate because they retain the largest paired-IK
# basin. Lateral rows intentionally cover coordinated y motion without asking
# either arm to enter the single-arm shelf regions.
sampling_matrix:
  - {start: shared_near, goal: shared_far, weight: 0.25}
  - {start: shared_far, goal: shared_near, weight: 0.20}
  - {start: shared_near, goal: shared_middle, weight: 0.10}
  - {start: shared_middle, goal: shared_far, weight: 0.10}
  - {start: shared_left_offset, goal: shared_right_offset, weight: 0.10}
  - {start: shared_right_offset, goal: shared_left_offset, weight: 0.10}
  - {start: shared_near, goal: shared_left_offset, weight: 0.075}
  - {start: shared_near, goal: shared_right_offset, weight: 0.075}

sampling:
  context_sampling_tries: 30
