# Current training placement cells, adjacent held-out cells, and named random supports.
# *_adjacent_* are uncalibrated generalization probes, not guaranteed reachable boxes.
# *_random_*_ood use joint/FK rejection (free orientation), with complete collision checks.
# Their XYZ supports are disjoint from the corresponding arm's training random box;
# they may overlap placement training data, so OOD means random-support OOD only.
# All sampling uses fresh system entropy; CLI region selections override the four YAML fields.
schema: marvin_bimanual_regions/v1
env_id: EnvWarehouseMarvinBimanual
robot_id: RobotMarvinBimanual
task_family: independent
task_mode: dual_independent
sampler: region_ik
planner: RRTConnect
random_to_placement_fraction: 0.5
seed: 12345
state_validity_resolution: 0.002
planner_range: 0.35
min_distance_robot_env: 0.02
state_sample_tries: 20000
ik_tries: 30
ik_iterations: 100
ik_reference_seed_fraction: 0.5
ik_position_tolerance: 0.003
ik_orientation_tolerance_deg: 2.0
max_sampling_attempts: 100
sampling_timeout_seconds: 120.0
disabled_self_collision_pairs:
- - Link5_R
  - Link7_R
