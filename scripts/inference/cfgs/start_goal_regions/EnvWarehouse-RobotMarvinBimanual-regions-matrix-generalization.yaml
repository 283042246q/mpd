# Inference regions for matrix-trained Marvin.
# placement_regions are the 14 structured training cells.
# placement_ood_regions preserve the corresponding training orientation support and
# are position-disjoint from every structured training cell.
# named_random_regions use free-orientation joint/FK rejection and are disjoint from
# both arms training-random supports and all 14 structured training cells.
# Sampling uses system entropy; CLI selections override the four YAML selections.
schema: marvin_bimanual_regions/v1
env_id: EnvWarehouseMarvinBimanual
robot_id: RobotMarvinBimanual
task_family: independent
task_mode: dual_independent
sampler: region_ik
planner: RRTConnect
random_to_placement_fraction: 0.5
seed: 12345
state_validity_resolution: 0.002
planner_range: 0.35
min_distance_robot_env: 0.02
state_sample_tries: 20000
ik_tries: 30
ik_iterations: 100
ik_reference_seed_fraction: 0.5
ik_position_tolerance: 0.003
ik_orientation_tolerance_deg: 2.0
max_sampling_attempts: 100
sampling_timeout_seconds: 120.0
disabled_self_collision_pairs:
- - Link5_R
  - Link7_R
inference_selection:
  start:
    left: left_table
    right: right_table
