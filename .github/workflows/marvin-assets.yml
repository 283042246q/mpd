name: Marvin asset consistency

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-assets:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install lightweight asset-check dependencies
        run: python -m pip install numpy PyYAML pytest
      - name: Verify assets, provenance and full-travel collision coverage
        run: >-
          python -m pytest -q
          tests/test_marvin_model_contract.py tests/test_marvin_pika_assets.py
          -k 'not runtime and not pybullet and not live_ros'
