# Pika TCP poses in base_link, meters; rotation = base * EulerXYZ(degrees).
env_id: EnvWarehouseMarvinBimanual
robot_id: RobotMarvinBimanual
task_family: independent
task_mode: dual_independent
output_dir: data_trajectories/EnvWarehouse-RobotMarvinBimanual-independent-v2
num_trajectories: 1000
seed: 1726484688
sampler: region_ik
planner: RRTConnect
planner_allowed_time: 10.0
# Avoid OMPL's automatic ~3.47 rad extension in the narrow 14D free space.
planner_range: 0.35
# Paired 100-endpoint ablation: 0.002 cut RRT work by 34.8% with zero
# full-model path leaks; 0.005 leaked four paths.
state_validity_resolution: 0.002
interpolate_num: 128
min_distance_robot_env: 0.02
# Direction mix is counted exactly over every 100 accepted trajectories.  The
# weights use 0.05 increments because every direction owns a five-task 3:1:1
# block (dual_independent:left_only:right_only).
trajectory_direction_weights:
  placement_to_placement: 0.45
  random_to_placement: 0.35
  placement_to_random: 0.10
  random_to_random: 0.10
# Regions below are already small atomic cells.  Same-cell motions are useful
# and remain non-trivial through min_active_joint_delta.
placement_goal_must_differ_from_source_region: false
# Hard per-task budget.  A task keeps the same mode/direction/source/goal
# regions across retries; exhausting this budget terminates its shard instead
# of changing the categorical task or consuming another task's allowance.
max_attempts_per_task: 30
task_timeout_seconds: 300
state_sample_tries: 2000
ik_tries: 30
ik_iterations: 100
ik_reference_seed_fraction: 0.5
fk_tries: 20000
ik_position_tolerance: 0.003
ik_orientation_tolerance_deg: 2.0
min_active_joint_delta: 0.08
# The 100-path paired test found PathSimplifier prohibitively expensive and
# capable of damaging valid raw paths. Keep it disabled in production.
simplify_path: false
# Experimental endpoint-pair gate before the expensive full-model RRT.
# The 100-pair ablation found both non-none modes slower per final trajectory
# and strongly biased against valid dual-arm paths, so production stays none.
# Available: none, endpoint_clearance, endpoint_clearance_and_sparse_line.
pre_rrt_filter: none
# Additional clearance beyond the collision model's existing safety margin.
pre_rrt_endpoint_environment_clearance: 0.005
# Marvin has valid adjacent-sphere configurations around 1--4 mm. This 1.5 mm
# experimental threshold is intentionally configurable; it is not enabled by default.
pre_rrt_endpoint_self_clearance: 0.0015
# The sparse line is a predictor, not a feasibility proof: allow some blocked
# samples because RRT may route around obstacles.
pre_rrt_sparse_line_points: 9
pre_rrt_sparse_line_min_valid_fraction: 0.5
collision_max_joint_step: 0.025
spline_validation_points: 512
bspline_num_control_points: 22
bspline_degree: 5
# Match the single-arm CPU parallelism. Shards are at most 500 trajectories;
# the launcher may split them further in multiples of 10 to keep 3 workers busy.
workers: 3
tasks_per_shard: 500
# OMPL/PbOMPL native objects have shown heap corruption in long-lived workers.
# Exit after two mode-balanced five-task blocks; the launcher retries only the
# lost block if a worker aborts, while already completed blocks remain resumable.
worker_lifetime_trajectories: 10
max_worker_restarts_per_shard: 3
# Retain existing mesh exception; the sphere model STILL checks this pair.
disabled_self_collision_pairs:
  - [Link5_R, Link7_R]
# Random endpoints deliberately cover a large, clearly reachable free-space
# volume above and around the table.  Left/right supports are separated at the
# centerline and stop before the shelf frontage (|y| >= 0.62).  Joint sampling
# retains unrestricted TCP orientation and still requires full collision
# validity; home is never returned as a fallback.
random_regions:
  left: {x: [[0.20, 0.85]], y: [[0.02, 0.60]], z: [[-0.05, 0.60]]}
  right: {x: [[0.20, 0.85]], y: [[-0.60, -0.02]], z: [[-0.05, 0.60]]}

# Placement proposals are proportional to each atomic cell's Cartesian volume,
# multiplied by a small [1.0, 1.5] difficulty boost.  This keeps broad regions
# dominant without starving narrow shelf/cross-boundary cells.
placement_region_weighting: volume
arm_placement_regions:
  left:
    - left_table
    - left_table_cross_y
    - left_table_cross_x
    - left_cabinet
    - left_cabinet_lower_xedge
    - left_cabinet_lower_yedge
    - left_cabinet_upper
  right:
    - right_table
    - right_table_cross_y
    - right_table_cross_x
    - right_cabinet
    - right_cabinet_lower_xedge
    - right_cabinet_lower_yedge
    - right_cabinet_upper
placement_region_difficulty_boosts:
  left:
    left_table_cross_y: 1.10
    left_table_cross_x: 1.25
    left_cabinet: 1.15
    left_cabinet_lower_xedge: 1.20
    left_cabinet_lower_yedge: 1.20
    left_cabinet_upper: 1.30
  right:
    right_table_cross_y: 1.20
    right_table_cross_x: 1.25
    right_cabinet: 1.15
    right_cabinet_lower_xedge: 1.20
    right_cabinet_lower_yedge: 1.20
    right_cabinet_upper: 1.30

