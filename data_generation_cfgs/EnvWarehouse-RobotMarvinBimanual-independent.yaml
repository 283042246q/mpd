# Pika TCP poses in base_link, meters; rotation = base * EulerXYZ(degrees).
env_id: EnvWarehouseMarvinBimanual
robot_id: RobotMarvinBimanual
task_family: independent
task_mode: dual_independent
output_dir: data_trajectories/EnvWarehouse-RobotMarvinBimanual-independent-v2
num_trajectories: 1000
seed: 1726484688
sampler: region_ik
planner: RRTConnect
# Experimental GPU alternative: override with --planner GpuBatchRRTConnect.
# It batches RRT samples/edges on the sphere model, freezes inactive-arm joints
# for left/right-only tasks, then keeps the same dense Torch + PyBullet path and
# spline audits as the CPU baseline. Keep this opt-in until a long-running
# single-process soak proves that it avoids the native multi-worker failures;
# the short benchmark only measures per-worker latency.
gpu_device: cuda:0
gpu_rrt_batch_size: 64
# The new multi-query backend separates trajectories per launch from candidate
# edges per trajectory. Conservative defaults leave headroom for 1,035 spheres.
gpu_query_batch_size_dual: 12
# With ten-task checkpoints and four candidates per task, the two single-arm
# tasks can currently supply at most eight queries; 16 is tested headroom for
# a future cross-checkpoint/wavefront scheduler rather than current occupancy.
gpu_query_batch_size_left: 16
gpu_query_batch_size_right: 16
gpu_rrt_edges_per_query: 16
gpu_rrt_max_iterations: 4096
gpu_rrt_goal_bias: 0.125
gpu_collision_batch_size: 256
gpu_shortcut_attempts: 64
gpu_workers: 1
gpu_worker_lifetime_trajectories: 100
# Dedicated multi-query pipeline. These settings are ignored by the original
# CPU generate/launch entrypoints.
gpu_pipeline_endpoint_workers: 4
gpu_pipeline_active_window_tasks: 80
gpu_pipeline_max_open_shards: 8
# Each proposer uses the CPU sphere model for sequential per-arm feedback, but
# still owns no OMPL, PyBullet or CUDA state. The GPU repeats the final check.
gpu_pipeline_endpoint_cpu_sphere_filter: true
gpu_pipeline_endpoint_candidates_per_attempt: 8
gpu_pipeline_endpoint_candidate_chunk_size: 2
# For dual tasks, combine each left-arm endpoint pair with each right-arm pair
# before the GPU inter-arm collision gate (8x8 at the default setting).
gpu_pipeline_dual_cross_candidates: 64
gpu_pipeline_planning_candidates_per_task: 4
# Keep the dedicated pipeline's retry policy independent from the legacy CPU
# generator without changing that generator's 30-attempt contract.
gpu_pipeline_max_attempts_per_task: 100
gpu_pipeline_checkpoint_size: 10
gpu_pipeline_actor_timeout_seconds: 600
gpu_pipeline_max_actor_restarts: 3
gpu_pipeline_pybullet_recycle_trajectories: 50
planner_allowed_time: 10.0
# Avoid OMPL's automatic ~3.47 rad extension in the narrow 14D free space.
planner_range: 0.35
# Paired 100-endpoint ablation: 0.002 cut RRT work by 34.8% with zero
# full-model path leaks; 0.005 leaked four paths.
state_validity_resolution: 0.002
interpolate_num: 128
min_distance_robot_env: 0.02
# Direction mix is counted exactly over every 100 accepted trajectories.  The
# weights use 0.05 increments because every direction owns a five-task 3:1:1
# block (dual_independent:left_only:right_only).
trajectory_direction_weights:
  placement_to_placement: 0.45
  random_to_placement: 0.35
  placement_to_random: 0.10
  random_to_random: 0.10
# Regions below are already small atomic cells.  Same-cell motions are useful
# and remain non-trivial through min_active_joint_delta.
placement_goal_must_differ_from_source_region: false
# Hard per-task budget.  A task keeps the same mode/direction/source/goal
# regions across retries; exhausting this budget terminates its shard instead
# of changing the categorical task or consuming another task's allowance.
max_attempts_per_task: 30
task_timeout_seconds: 300
state_sample_tries: 2000
ik_tries: 30
ik_iterations: 100
ik_reference_seed_fraction: 0.5
fk_tries: 20000
ik_position_tolerance: 0.003
ik_orientation_tolerance_deg: 2.0
min_active_joint_delta: 0.08
# The 100-path paired test found PathSimplifier prohibitively expensive and
# capable of damaging valid raw paths. Keep it disabled in production.
simplify_path: false
# Experimental endpoint-pair gate before the expensive full-model RRT.
# The 100-pair ablation found both non-none modes slower per final trajectory
# and strongly biased against valid dual-arm paths, so production stays none.
# Available: none, endpoint_clearance, endpoint_clearance_and_sparse_line.
pre_rrt_filter: none
# Additional clearance beyond the collision model's existing safety margin.
pre_rrt_endpoint_environment_clearance: 0.005
# Marvin has valid adjacent-sphere configurations around 1--4 mm. This 1.5 mm
# experimental threshold is intentionally configurable; it is not enabled by default.
pre_rrt_endpoint_self_clearance: 0.0015
# The sparse line is a predictor, not a feasibility proof: allow some blocked
# samples because RRT may route around obstacles.
pre_rrt_sparse_line_points: 9
pre_rrt_sparse_line_min_valid_fraction: 0.5
collision_max_joint_step: 0.025
spline_validation_points: 512
bspline_num_control_points: 22
bspline_degree: 5
# Match the single-arm CPU parallelism. Shards are at most 500 trajectories;
# the launcher may split them further in multiples of 10 to keep 3 workers busy.
workers: 3
tasks_per_shard: 500
# OMPL/PbOMPL native objects have shown heap corruption in long-lived workers.
# Exit after two mode-balanced five-task blocks; the launcher retries only the
# lost block if a worker aborts, while already completed blocks remain resumable.
worker_lifetime_trajectories: 10
max_worker_restarts_per_shard: 3
# Retain existing mesh exception; the sphere model STILL checks this pair.
disabled_self_collision_pairs:
  - [Link5_R, Link7_R]
# Random endpoints deliberately cover a large, clearly reachable free-space
# volume above and around the table.  Left/right supports are separated at the
# centerline and stop before the shelf frontage (|y| >= 0.62).  Joint sampling
# retains unrestricted TCP orientation and still requires full collision
# validity; home is never returned as a fallback.
random_regions:
  left: {x: [[0.20, 0.85]], y: [[0.02, 0.60]], z: [[-0.05, 0.60]]}
  right: {x: [[0.20, 0.85]], y: [[-0.60, -0.02]], z: [[-0.05, 0.60]]}

# Endpoint marginals: 55% estimated effective volume, 30% uniform, 15% hard pool.
# P->P uses balanced pair matrices with these same source/goal marginals.
placement_region_weighting: mixture
arm_placement_regions:
  left:
    - left_table
    - left_table_cross_y
    - left_table_cross_x
    - left_cabinet
    - left_cabinet_lower_xedge
    - left_cabinet_lower_yedge
    - left_cabinet_upper
  right:
    - right_table
    - right_table_cross_y
    - right_table_cross_x
    - right_cabinet
    - right_cabinet_lower_xedge
    - right_cabinet_lower_yedge
    - right_cabinet_upper
placement_mixture:
  effective_volume: 0.55
  uniform: 0.30
  hard: 0.15
  # Historical proxy rates, NOT calibrated measurements of these cropped cells.
  # T/S: workspace-dense-v3; cross/edges/U: workspace-edges-2400 (U=xedge).
  collision_valid_rates:
    left:
      left_table: 0.31
      left_table_cross_y: 0.21
      left_table_cross_x: 0.53
      left_cabinet: 0.31
      left_cabinet_lower_xedge: 0.415
      left_cabinet_lower_yedge: 0.545
      left_cabinet_upper: 0.115
    right:
      right_table: 0.17
      right_table_cross_y: 0.03
      right_table_cross_x: 0.415
      right_cabinet: 0.03
      right_cabinet_lower_xedge: 0.27
      right_cabinet_lower_yedge: 0.385
      right_cabinet_upper: 0.125
  hard_regions:
    left: [left_table_cross_y, left_table_cross_x, left_cabinet, left_cabinet_lower_xedge, left_cabinet_lower_yedge, left_cabinet_upper]
    right: [right_table_cross_y, right_table_cross_x, right_cabinet, right_cabinet_lower_xedge, right_cabinet_lower_yedge, right_cabinet_upper]
placement_pair_sampling:
  same_cell_fraction: 0.12
  preferences:
    table_other: 1.0
    cross_cross: 0.5
    cross_shelf: 0.15
    lower_upper: 0.3
    lower_lower: 0.7
  dual_preferences:
    both_cross: 0.2
    both_upper: 0.3
    cross_upper: 0.3

